<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Mastery - Pre-Interview Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body class="h-screen flex flex-col bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 antialiased overflow-hidden">

  <!-- Header -->
  <header class="h-16 border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-[#0b0f19]/80 glass-header flex items-center justify-between px-4 sm:px-8 z-30 shrink-0">
    <div class="flex items-center gap-3 cursor-pointer" id="nav-logo-btn">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-500/20">
        A
      </div>
      <div>
        <h1 class="font-bold text-base tracking-tight leading-none text-slate-800 dark:text-slate-100">Android Senior Hub</h1>
        <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Pre-Interview Prep</span>
      </div>
    </div>

    <!-- Search Input -->
    <div class="hidden sm:flex items-center relative w-72">
      <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-xs"></i>
      <input type="text" id="search-input" placeholder="Tìm chủ đề, kiến thức..." class="w-full bg-slate-100 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 rounded-full pl-9 pr-4 py-1.5 text-xs focus:outline-none focus:border-indigo-500 transition-colors" />
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2">
      <button id="theme-toggle-btn" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400 hover:text-indigo-400 transition-colors">
        <i class="fa-solid fa-moon text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Home View -->
  <main id="home-view" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-8 lg:p-10">
    <div class="max-w-6xl mx-auto space-y-8">
      <div>
        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Danh sách khóa học Android</h2>
        <p class="text-slate-400 text-sm mt-1">Hệ thống hóa kiến thức chuyên sâu chuẩn bị cho các buổi phỏng vấn Senior Android Developer.</p>
      </div>

      <!-- Courses Grid -->
      <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>
  </main>

  <!-- Course Detail View -->
  <div id="course-detail-view" class="flex-1 flex overflow-hidden relative hidden">
    <!-- Sidebar -->
    <aside id="course-sidebar" class="w-80 border-r border-slate-800 bg-slate-950/40 flex flex-col shrink-0 absolute md:relative z-20 h-full transition-transform -translate-x-full md:translate-x-0">
      <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
        <div>
          <button onclick="window.app.navigateToHome()" class="text-xs text-indigo-400 hover:underline mb-1 inline-flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> Trở về Trang chủ
          </button>
          <h2 id="sidebar-course-title" class="font-bold text-sm text-slate-200 truncate">Course Title</h2>
        </div>
      </div>
      <div id="sidebar-lessons-list" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1.5"></div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto custom-scroll p-6 lg:p-10 bg-slate-900/20">
      <button id="mobile-sidebar-toggle" class="md:hidden mb-4 px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-slate-300 border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-list"></i> Danh sách bài học
      </button>
      <div id="lesson-content" class="max-w-4xl mx-auto"></div>
    </main>
  </div>

</body>
</html>
