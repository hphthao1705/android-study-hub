              <span class="px-2.5 py-1 rounded-md bg-pink-500/10 text-pink-600 dark:text-pink-400 border border-pink-500/20 text-xs font-mono font-bold">Chuyên Đề 05</span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-3">Exception Transparency (Minh Bạch Ngoại Lệ)</h2>
              <p class="text-slate-600 dark:text-slate-400 text-sm mt-2">Bản chất emit(), Thảm họa nuốt lỗi hạ lưu & Ranh giới toán tử .catch.</p>
            </div>
            <div class="p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-300 space-y-3">
              <p><strong>1. Thảm họa nuốt lỗi UI:</strong> Bọc <code>try-catch</code> quanh <code>emit()</code> sẽ bắt nhầm lỗi ném ra từ khối <code>collect</code> của UI (ví dụ <code>IndexOutOfBoundsException</code>), biến lỗi crash giao diện thành silent bug ở Repository.</p>
              <p><strong>2. Ranh giới .catch:</strong> Toán tử <code>.catch</code> chỉ bắt ngoại lệ xảy ra ở Upstream, không bắt lỗi phát sinh bên trong khối <code>collect</code> hạ lưu.</p>

      },
      {
        id: "flowadv",
        num: "06",
        badge: "Reactive Flow",
        title: "Flow Nâng Cao: Backpressure & Operators",
        desc: "conflate vs collectLatest, debounce vs sample, channelFlow, callbackFlow & Ring Buffer.",
        content: `
          <div class="space-y-6">
            <div class="border-b border-slate-200 dark:border-slate-800 pb-6">
              <span class="px-2.5 py-1 rounded-md bg-teal-500/10 text-teal-600 dark:text-teal-400 border border-teal-500/20 text-xs font-mono font-bold">Chuyên Đề 06</span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-3">Flow Nâng Cao: Backpressure & Operators</h2>
              <p class="text-slate-600 dark:text-slate-400 text-sm mt-2">conflate vs collectLatest, debounce vs sample, channelFlow, callbackFlow & Ring Buffer.</p>
            </div>
            <div class="p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-300 space-y-3">
              <p><strong>1. conflate() vs collectLatest:</strong> <code>conflate()</code> drop dữ liệu ở bộ đệm tầng phát (Buffer); <code>collectLatest</code> hủy (cancel) coroutine đang xử lý ở tầng nhận (Collector).</p>
              <p><strong>2. callbackFlow & awaitClose:</strong> Bắt buộc phải có <code>awaitClose</code> ở cuối để giữ channel mở cho callback tiếp tục phát sự kiện.</p>

        content: `
          <div class="space-y-6">

              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-3">Jetpack Compose & Vòng Đời Thu Thập An Toàn</h2>

    let currentTopicId = "cps";

    function renderSidebar() {
      const container = document.getElementById("topic-list");
      if (!container) return;
      container.innerHTML = topics.map(t => {
        const isActive = t.id === currentTopicId;
        return `
          <button onclick="selectTopic('${t.id}')" 
            class="w-full text-left p-3 rounded-xl transition flex flex-col gap-1 border ${
              isActive 
                ? 'bg-emerald-500/10 dark:bg-emerald-500/20 border-emerald-500/40 text-emerald-700 dark:text-emerald-300' 
                : 'bg-transparent border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300'
            }">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-mono font-bold ${isActive ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">${t.num}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded font-semibold uppercase ${
                isActive ? 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'
              }">${t.badge}</span>
            </div>
            <h4 class="font-bold text-xs leading-snug line-clamp-2">${t.title}</h4>
          </button>
        `;
      }).join("");
    }

    function selectTopic(id) {
      currentTopicId = id;
      renderSidebar();
      const topic = topics.find(t => t.id === id);
      const main = document.getElementById("article-container");
      if (main && topic) {
        main.innerHTML = topic.content;
      }
      
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      if (sidebar && overlay) {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }
    }

    function toggleSidebarMobile() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      if (!sidebar || !overlay) return;
      const isClosed = sidebar.classList.contains("-translate-x-full");
      if (isClosed) {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
      } else {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon text-sm text-slate-700';
      } else {
        html.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun text-sm text-amber-400';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();
      selectTopic("cps");
    });
  </script>
</body>
