                    Bản chất cơ học tầng sâu: Cách Kotlin biến đổi code bất đồng bộ thành State Machine, quản trị vòng đời Call Stack trên Heap, và cách runtime tối ưu cấp phát bộ nhớ.

                <!-- 1. CPS -->
                <section class="space-y-4">
                  <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-xs font-bold">1</span>

                    <li><strong>Kiểu trả về <code>Object</code> (Union Type):</strong> Trong Java bytecode, kiểu trả về của hàm luôn đổi thành <code>java.lang.Object</code> để chứa được cả giá trị thật <code>T</code> hoặc cờ hiệu <code>COROUTINE_SUSPENDED</code>.</li>

                    <li><strong>Bản chất:</strong> Quá trình dịch ngược từ file <code>.class</code> / <code>.dex</code> ra Java code để quan sát kiến trúc ẩn do compiler sinh ra.</li>
                    <li><strong>Bản chất State Machine:</strong> Một hàm suspend chứa nhiều điểm dừng sẽ được compiler bao gói lại trong một lớp nội danh kế thừa <code>ContinuationImpl</code>, điều khiển qua lệnh <code>switch(this.label)</code>.</li>

                    <li><strong>Tràn biến cục bộ (Spilling):</strong> Các biến cục bộ sống qua điểm suspend được compiler copy vào các trường <code>L\\$0, L\\$1</code> của State Machine để không bị mất khi nhả stack frame.</li>

                    <pre class="p-4 overflow-x-auto leading-relaxed custom-scroll"><code>class FetchUserStateMachine extends ContinuationImpl {
    Object result;
    int label; // Virtual Program Counter
    String id;

    FetchUserStateMachine(Continuation completion) { super(completion); }
    Object invokeSuspend(Object result) {
        this.result = result;
        this.label |= Integer.MIN_VALUE;
        return fetchUser(null, this);
    }
}

Object fetchUser(String id, Continuation \\$completion) {
    FetchUserStateMachine sm;
    if (\\$completion instanceof FetchUserStateMachine && ((\\$completion.label & Integer.MIN_VALUE) != 0)) {
        sm = (FetchUserStateMachine) \\$completion;
        sm.label -= Integer.MIN_VALUE; // Tái sử dụng instance
    } else {
        sm = new FetchUserStateMachine(\\$completion);
    }

    switch (sm.label) {
        case 0:
            sm.id = id;
            sm.label = 1;
            Object res = fetchFromNetwork(sm.id, sm);
            if (res == COROUTINE_SUSPENDED) {
                return COROUTINE_SUSPENDED; // Thoát Caller Frame ngay lập tức!
            }
        case 1:
            User user = (User) sm.result;
            return formatUser(user);
    }
}</code></pre>

                    <li><strong>Android Profile-guided JIT:</strong> ART kết hợp cả JIT và AOT, biên dịch native các hot-spot path để loại bỏ overhead ở các lần chạy sau.</li>
                  </ul>

                <section class="space-y-4">

                  </ul>
                </section>

            content: `
              <div class="space-y-8">

                  <div class="flex items-center gap-2 mb-3">

                </div>

            desc: "Cách Compose runtime lưu trữ trạng thái Composition trên một mảng tuyến tính có khoảng trống (Gap Buffer).",
            content: `
              <div class="p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800"><h3 class="font-bold text-sm">Slot Table & Gap Buffer Architecture</h3><p class="text-xs text-slate-500 mt-2">Đang nạp bài giảng...</p></div>
            `
          }
        ]
      },
      {
        id: "compose-navigation-type-safe",
        title: "Type-safe Compose Navigation 2.8+",
        category: "Navigation",
        icon: "fa-signs-post",
        color: "from-blue-500 to-cyan-600",
        badge: "Modern UI",
        description: "Loại bỏ String-route URL truyền thống. Sử dụng @Serializable Object & Data Class, Custom NavType, Nested NavGraph và Single Top Launch Modes.",
        lessons: [
          {
            id: "typesafe-nav-serialization",
            num: "01",
            badge: "Architecture",
            title: "Kiến Trúc Type-Safe Navigation Với Kotlinx Serialization",
            desc: "Cách Navigation 2.8+ serialize đối tượng tham số vào SavedStateHandle mà không cần String bundle lộn xộn.",
            content: `
              <div class="p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800"><h3 class="font-bold text-sm">Type-Safe Navigation Patterns</h3><p class="text-xs text-slate-500 mt-2">Đang nạp bài giảng...</p></div>
            `
          }
        ]
      },
      {
        id: "compose-canvas-math-angles",
        title: "Compose Canvas, DrawScope & Math Angles",
        category: "Custom UI",
        icon: "fa-bezier-curve",
        color: "from-pink-500 to-rose-600",
        badge: "Graphics",
        description: "Hệ tọa độ DrawScope, Path, Bezier Curves, Phép quay lượng giác Radian vs Degree, Arc/SweepAngle và tối ưu hóa vẽ đồ thị custom không tốn CPU.",
        lessons: [
          {
            id: "canvas-drawscope-mechanics",
            num: "01",
            badge: "Rendering",
            title: "Hệ Tọa Độ DrawScope & Toán Học Đường Cong Lượng Giác",
            desc: "Công thức chuyển đổi Radian/Degree, tính toán tọa độ điểm tiếp xúc hình tròn và xây dựng Custom Gauge.",
            content: `
              <div class="p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800"><h3 class="font-bold text-sm">Compose Canvas & Math Angles</h3><p class="text-xs text-slate-500 mt-2">Đang nạp bài giảng...</p></div>
            `
          }
        ]
      },
      {
        id: "workmanager-vs-foreground",
        title: "WorkManager vs Foreground Service Architecture",
        category: "Background Work",
        icon: "fa-gears",
        color: "from-teal-500 to-emerald-600",
        badge: "System Core",
        description: "Android OS Doze Mode, Battery Saver, JobScheduler, Expedited Jobs, Foreground Service Types (Android 14+) và cạm bẫy ANR background.",
        lessons: [
          {
            id: "background-execution-limits",
            num: "01",
            badge: "OS Limits",
            title: "Bản Đồ Quyết Định: WorkManager vs Foreground Service",
            desc: "Khi nào dùng Coroutine Worker có ràng buộc pin/mạng và khi nào bắt buộc dựng Foreground Service gắn Notification.",
            content: `
              <div class="p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800"><h3 class="font-bold text-sm">WorkManager vs Foreground Service Decision Tree</h3><p class="text-xs text-slate-500 mt-2">Đang nạp bài giảng...</p></div>
            `
          }
        ]
      },
      {
        id: "testing-coroutines-turbine",
        title: "Testing Coroutines/Flow with Turbine & TestScope",
        category: "Testing",
        icon: "fa-vial-circle-check",
        color: "from-lime-500 to-emerald-700",
        badge: "Unit Test",
        description: "StandardTestDispatcher, UnconfinedTestDispatcher, AdvanceUntilIdle, Turbine test framework để bắt trọn chuỗi emit của StateFlow / SharedFlow.",
        lessons: [
          {
            id: "turbine-virtual-time",
            num: "01",
            badge: "Testing",
            title: "Virtual Time Trong TestScope & Bắt Sự Kiện Với Turbine",
            desc: "Kiểm soát thời gian ảo mà không cần dùng Thread.sleep() hoặc delay vật lý trong Unit Test.",
            content: `
              <div class="p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800"><h3 class="font-bold text-sm">Turbine & TestDispatcher Best Practices</h3><p class="text-xs text-slate-500 mt-2">Đang nạp bài giảng...</p></div>
            `
          }
        ]
      },
      {
        id: "android-core-process-death",
        title: "Android Core (Process Death, Activity/Task Lifecycle)",
        category: "OS Core",
        icon: "fa-skull-crossbones",
        color: "from-orange-500 to-red-600",
        badge: "Low-level",
        description: "Process Death vs Configuration Change, SavedStateHandle, Activity recreation, Task Affinities, Launch Modes (singleTask, singleInstance) & LMK.",
        lessons: [
          {
            id: "process-death-saved-state",
            num: "01",
            badge: "System Core",
            title: "Process Death vs Configuration Change & Low Memory Killer",
            desc: "Cơ chế giải phóng RAM của Linux OOM Killer và cách phục hồi dữ liệu từ SavedStateHandle.",
            content: `
              <div class="p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800"><h3 class="font-bold text-sm">Process Death & LMK Architecture</h3><p class="text-xs text-slate-500 mt-2">Đang nạp bài giảng...</p></div>
            `
          }
        ]
      }
    ];

    let currentCourseId = "coroutines-flow-core";
    let currentLessonId = "cps-decompile-jit";
    let searchQuery = "";

    const homeView = document.getElementById("home-view");
    const courseDetailView = document.getElementById("course-detail-view");
    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const navHomeBtn = document.getElementById("nav-home-btn");

    function renderHomeView() {
      const courseGrid = document.getElementById("course-grid");
      if (!courseGrid) return;

      const filteredCourses = coursesRepository.filter(c => {
        const matchTitle = c.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchDesc = c.description.toLowerCase().includes(searchQuery.toLowerCase());
        const matchLessons = c.lessons.some(l => l.title.toLowerCase().includes(searchQuery.toLowerCase()) || l.desc.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchTitle || matchDesc || matchLessons;
      });

      if (filteredCourses.length === 0) {
        courseGrid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-3xl mb-3 text-slate-500"></i>
            <p class="text-sm font-semibold">Không tìm thấy khóa học hoặc bài giảng nào phù hợp</p>
            <p class="text-xs text-slate-500 mt-1">Thử từ khóa khác như "Room", "Flow", "Compose", "Canvas"...</p>
          </div>
        `;
        return;
      }

      courseGrid.innerHTML = filteredCourses.map(course => `
        <div onclick="openCourse('${course.id}')" class="group bg-white dark:bg-slate-900/90 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 hover:border-emerald-500/50 transition-all duration-200 cursor-pointer shadow-sm hover:shadow-md flex flex-col justify-between">
          <div>
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr ${course.color} flex items-center justify-center text-white shadow-md shadow-emerald-500/10 group-hover:scale-105 transition shrink-0">
                <i class="fa-solid ${course.icon} text-base"></i>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-mono font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                ${course.lessons.length} Bài Học
              </span>
            </div>
            <span class="text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider font-mono">${course.category}</span>
            <h3 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base mt-1 group-hover:text-emerald-500 dark:group-hover:text-emerald-400 transition">
              ${course.title}
            </h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 line-clamp-3 leading-relaxed">
              ${course.description}
            </p>
          </div>

          <div class="pt-4 mt-4 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between">
            <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1 group-hover:translate-x-0.5 transition">
              Vào học ngay <i class="fa-solid fa-arrow-right text-[10px] text-emerald-500"></i>
            </span>
            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold">${course.badge}</span>
          </div>
        </div>
      `).join("");
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      renderHomeView();
    }

    function navigateToHome() {
      homeView.classList.remove("hidden");
      courseDetailView.classList.add("hidden");
      mobileMenuBtn.classList.add("hidden");
      navHomeBtn.classList.add("ring-2", "ring-emerald-500/40");
      renderHomeView();
    }

    function openCourse(courseId) {
      currentCourseId = courseId;
      const course = coursesRepository.find(c => c.id === courseId);
      if (!course) return;

      currentLessonId = course.lessons[0].id;

      homeView.classList.add("hidden");
      courseDetailView.classList.remove("hidden");
      mobileMenuBtn.classList.remove("hidden");
      navHomeBtn.classList.remove("ring-2", "ring-emerald-500/40");

      document.getElementById("current-course-title").innerText = course.title;
      document.getElementById("current-course-count").innerText = `${course.lessons.length} Bài`;

      renderSidebarLessons();
      renderLessonContent(currentLessonId);
    }

    function renderSidebarLessons() {
      const container = document.getElementById("lesson-list");
      const course = coursesRepository.find(c => c.id === currentCourseId);
      if (!container || !course) return;

      container.innerHTML = course.lessons.map(lesson => {
        const isActive = lesson.id === currentLessonId;
        return `
          <button onclick="selectLesson('${lesson.id}')" 
            class="w-full text-left p-3 rounded-xl transition flex flex-col gap-1 border ${
              isActive 
                ? 'bg-emerald-500/10 dark:bg-emerald-500/20 border-emerald-500/40 text-emerald-700 dark:text-emerald-300' 
                : 'bg-transparent border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300'
            }">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-mono font-bold ${isActive ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">${lesson.num}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded font-semibold uppercase ${
                isActive ? 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'
              }">${lesson.badge}</span>
            </div>
            <h4 class="font-bold text-xs leading-snug line-clamp-2">${lesson.title}</h4>
          </button>
        `;
      }).join("");
    }

    function selectLesson(lessonId) {
      currentLessonId = lessonId;
      renderSidebarLessons();
      renderLessonContent(lessonId);

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      sidebar.classList.add("-translate-x-full");
      overlay.classList.add("hidden");
    }

    function renderLessonContent(lessonId) {
      const course = coursesRepository.find(c => c.id === currentCourseId);
      const lesson = course ? course.lessons.find(l => l.id === lessonId) : null;
      const main = document.getElementById("article-container");
      if (main && lesson) {
        main.innerHTML = lesson.content;
      }
    }

    function toggleSidebarMobile() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      if (!sidebar || !overlay) return;
      const isClosed = sidebar.classList.contains("-translate-x-full");
      if (isClosed) {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
      } else {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('theme-icon');
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon text-sm text-slate-700';
      } else {
        html.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun text-sm text-amber-400';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderHomeView();
    });
  </script>
</body>
</html>
